<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="CineLog - The ultimate tracking platform for movies, TV series, anime, custom lists, and review diaries." />
    <meta name="keywords" content="movies, tracking, diary, letterboxd alternative, film diary, cinema log, series tracker" />

    <!-- Open Graph / Facebook / Discord / WhatsApp -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://cinelog-phi.vercel.app/" />
    <meta property="og:title" content="CineLog — Premium Movie Tracking &amp; Diary" />
    <meta property="og:description" content="The ultimate tracking platform for movies, TV series, anime, custom collections, and review diaries." />
    <meta property="og:image" content="https://cinelog-phi.vercel.app/dune_spotlight.jpg" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://cinelog-phi.vercel.app/" />
    <meta name="twitter:title" content="CineLog — Premium Movie Tracking &amp; Diary" />
    <meta name="twitter:description" content="The ultimate tracking platform for movies, TV series, anime, custom collections, and review diaries." />
    <meta name="twitter:image" content="https://cinelog-phi.vercel.app/dune_spotlight.jpg" />

    <!-- Performance preconnects -->
    <link rel="preconnect" href="https://image.tmdb.org" crossorigin />
    <link rel="dns-prefetch" href="https://image.tmdb.org" />
    <link rel="preconnect" href="https://api.themoviedb.org" crossorigin />

    <title>CineLog — Premium Movie Tracking &amp; Diary</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- Web App / PWA Capabilities -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- Immediate dark canvas styling -->
    <style>
      html, body, #root {
        background-color: #000000 !important;
        background: #000000 !important;
        color: #ffffff;
        margin: 0;
        padding: 0;
        min-height: 100%;
        overscroll-behavior-y: none;
      }
    </style>
  </head>
  <body style="background-color: #000000; margin: 0; padding: 0;">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
